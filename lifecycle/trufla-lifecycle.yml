note: |
  Trufla runs a product lifecycle, not an API lifecycle. Versions are announced
  per product in the release notes; there is no API version, no deprecation
  policy, no Sunset/Deprecation header contract (RFC 8594), no published SLA and
  no working status page. status.trufla.com is provisioned but broken: DNS
  CNAMEs to Atlassian Statuspage (0jmtjtdvnvs8.stspg-customer.com) while the
  presented certificate does not cover the custom domain, so a verified HTTPS
  request fails outright (curl exit on TLS, http=000; only -k returns content,
  and the content served is an Atlassian page rather than a Trufla status page).
  Because the page does not actually work for a customer, no StatusPage pointer
  is wired in apis.yml — that would claim operational transparency the provider
  does not deliver. Likewise no Deprecation pointer: no deprecation policy of
  any kind is published.
