source: |
  Derived from the public surface only — there is no OpenAPI, AsyncAPI, GraphQL
  SDL or .proto to read. Evidence comes from www.trufla.com product/legal pages,
  the published release notes, the harvested llms.txt, live /.well-known probes,
  the SafeBase trust center, and the trufla-technology GitHub organization.
  Nothing here is a Trufla conformance claim; Trufla publishes no conformance
  statement for any standard.
note: |
  The insurance-standards seam for Trufla is CSIO, not ACORD. CSIO appears once
  on the public site as an implementation step during truMarket onboarding, and
  once in the terms of service as a client responsibility ("CISIO account and
  mailbox" — Trufla's spelling). No ACORD, AL3, ACORD XML, NGDS or IVANS
  reference appears anywhere on the site. No Compliance pointer is wired in
  apis.yml: the SafeBase trust center states Trufla is "working towards
  compliance certifications" and names no completed certification.
