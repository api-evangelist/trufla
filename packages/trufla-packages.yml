note: |
  Trufla publishes no API client SDKs — there is no public Trufla API to write a
  client against. What it does publish is one first-party open-source front-end
  library on npm under the @trufla scope, plus a second, older form library
  published from an employee's personal GitLab namespace. Neither is an API
  client. Registries probed on 2026-07-25: npm (2 hits, below), PyPI
  (https://pypi.org/pypi/trufla/json -> HTTP 404), Maven Central, NuGet,
  pkg.go.dev, RubyGems, Packagist and crates.io (no first-party Trufla
  packages). The GitHub organization github.com/trufla-technology exists
  (7 public repositories) but every current public repo is a fork of a
  third-party project — Apache Superset, laravel-one-time-operations,
  tymondesigns/jwt-auth, laravel-fcm, microsoft-teams-apps-icebreaker,
  openid/AppAuth-Android and a demo shop app. The ngx-tru-forms source repo
  referenced by the npm package (trufla-technology/ngx-tru-forms) now returns
  HTTP 404 — the package remains on npm but the repository is gone or private.
