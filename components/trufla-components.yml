note: |
  Trufla ships no hosted embeddable widgets, no web-component loader and no
  embedded-dashboard product for third parties. The only publicly consumable
  client-side component surface is a JSON-Schema-driven dynamic form library
  published to npm under the first-party @trufla scope. Everything else that
  looks like a component — the truMobile customer self-service portal, the
  truMarket quote/bind/issue screens, the truMobile Marketplace storefront and
  the DataHub Policy KPI dashboard — is delivered inside a licensed product,
  not as a component a developer can embed.
