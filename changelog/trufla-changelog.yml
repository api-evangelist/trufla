note: |
  Trufla publishes dated, per-product release notes for its licensed products,
  not for an API. Entries are written for brokerage staff — features, fixes and
  UX changes — and carry no breaking-change register, no deprecation notices
  and no API version numbers. They are still the best public record of what
  ships and when, and they leak real platform detail: Laravel Octane on the
  truMobile backend, Keycloak-to-WordPress role alignment in truWeb, BMS
  integration error logging, and "Policy Attach/Detach Event Notifications".
scheme: per-product; truMobile/truMarket/truWeb use a YY.Q.BUILD form (for
  example 25.3.97 = 2025, third cycle, build 97), while newer modules restart
  at semver (Central Admin 1.0.0). Older truMobile entries used a plain major
  series (8.0, 9.0, 10.0, 11.0).
breaking_change_policy: none published
deprecation_notices: none published
api_versioning: not applicable — no public API is versioned or published
